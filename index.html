<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="点货">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23007aff'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='system-ui'>点</text></svg>">
  <title>点货</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 16px; padding-top: max(16px, env(safe-area-inset-top));
      background: #f5f5f7; color: #1d1d1f; min-height: 100vh;
    }
    h1 { font-size: 22px; margin: 0 0 16px; display: flex; align-items: center; justify-content: space-between; }
    .edit-wh-btn {
      font-size: 14px; padding: 6px 12px; background: #e5e5ea; border: none;
      border-radius: 8px; color: #1d1d1f; font-weight: 500; cursor: pointer;
    }
    .warehouse-selector {
      display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
    }
    .warehouse-selector button.wh-btn {
      flex: 1; min-width: 80px; padding: 12px; border: 2px solid #d1d1d6; border-radius: 12px;
      background: white; font-size: 16px; font-weight: 500; color: #1d1d1f; cursor: pointer;
      transition: all 0.15s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .warehouse-selector button.wh-btn.active {
      border-color: #007aff; background: #007aff; color: white;
    }
    .input-section {
      background: white; border-radius: 16px; padding: 16px; margin-bottom: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .input-tip { font-size: 13px; color: #86868b; margin-bottom: 8px; }
    #transcript {
      width: 100%; min-height: 60px; padding: 12px; border: 1.5px solid #d1d1d6;
      border-radius: 12px; font-size: 18px; line-height: 1.5; resize: none;
      font-family: inherit; background: #fafafa; margin-bottom: 12px;
    }
    #transcript:focus { outline: none; border-color: #007aff; background: white; }
    .btn-row { display: flex; gap: 10px; }
    .btn {
      flex: 1; padding: 14px; border: none; border-radius: 12px; font-size: 16px;
      font-weight: 600; cursor: pointer; transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.7; }
    .btn-primary { background: #007aff; color: white; }
    .list-section {
      background: white; border-radius: 16px; overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .list-header {
      padding: 14px 16px; font-weight: 600; font-size: 15px;
      background: #fafafa; border-bottom: 1px solid #e5e5ea;
      display: flex; justify-content: space-between; align-items: center;
    }
    .list-header span { color: #86868b; font-weight: 400; }
    #item-list { list-style: none; margin: 0; padding: 0; }
    #item-list li {
      padding: 14px 16px; border-bottom: 1px solid #f0f0f0;
      display: flex; justify-content: space-between; align-items: center; font-size: 16px;
    }
    #item-list li:last-child { border-bottom: none; }
    .item-name { flex: 1; word-break: break-all; }
    .item-qty {
      font-weight: 700; color: #007aff; margin: 0 12px; font-size: 18px; min-width: 40px;
      text-align: right;
    }
    .delete-btn {
      background: none; border: none; color: #ff3b30; font-size: 20px;
      cursor: pointer; padding: 4px 8px;
    }
    .empty-state { padding: 32px; text-align: center; color: #86868b; font-size: 15px; }
    .toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
      background: #1d1d1f; color: white; padding: 12px 24px; border-radius: 12px;
      font-size: 14px; opacity: 0; transition: opacity 0.25s; pointer-events: none;
      z-index: 100;
    }
    .toast.show { opacity: 1; }
    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      body { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>

  <h1>
    📦 点货
    <button class="edit-wh-btn" id="rename-wh-btn">✏️ 改仓名</button>
  </h1>

  <div class="warehouse-selector" id="warehouse-selector"></div>

  <div class="input-section">
    <div class="input-tip">点击输入框，使用键盘上的 🎤 听写（格式：商品名 数量）</div>
    <!-- 关键：加上 enterkeyhint="done" 方便手机键盘操作 -->
    <textarea id="transcript" placeholder="例如：苹果 10" enterkeyhint="done"></textarea>
    <div class="btn-row">
      <button class="btn btn-primary" id="add-btn">添加</button>
    </div>
  </div>

  <div class="list-section">
    <div class="list-header">
      <span id="list-title">已点货物</span>
      <span id="item-count">0 项</span>
    </div>
    <ul id="item-list"></ul>
    <div class="empty-state" id="empty-state">还没有点货记录<br>输入后点击“添加”</div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
  (function() {
    'use strict';

    // ---------- 状态与存储 ----------
    const STORAGE_KEY = 'dianhuo_data_v2';
    let warehouses = ['A仓', 'B仓', 'C仓']; // 默认仓名
    let currentWarehouse = 'A仓';
    let items = []; // { name, qty, warehouse }

    const $ = id => document.getElementById(id);
    const warehouseSelector = $('warehouse-selector');
    const transcript = $('transcript');
    const addBtn = $('add-btn');
    const itemList = $('item-list');
    const emptyState = $('empty-state');
    const listTitle = $('list-title');
    const itemCount = $('item-count');
    const toastEl = $('toast');
    const renameWhBtn = $('rename-wh-btn');

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ 
          warehouses: warehouses, 
          warehouse: currentWarehouse, 
          items: items 
        }));
      } catch (e) {}
    }

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('dianhuo_data_v1');
        if (!raw) return;
        const data = JSON.parse(raw);
        if (data.warehouses && Array.isArray(data.warehouses)) warehouses = data.warehouses;
        if (data.warehouse) currentWarehouse = data.warehouse;
        if (Array.isArray(data.items)) items = data.items;
        
        // 兼容旧数据：如果当前仓不在列表里，加进去
        if (!warehouses.includes(currentWarehouse)) {
          warehouses.push(currentWarehouse);
        }
      } catch (e) {}
    }

    // ---------- 渲染 ----------
    function render() {
      // 1. 渲染货仓按钮
      warehouseSelector.innerHTML = '';
      warehouses.forEach(wh => {
        const btn = document.createElement('button');
        btn.className = 'wh-btn' + (wh === currentWarehouse ? ' active' : '');
        btn.textContent = wh;
        btn.dataset.wh = wh;
        warehouseSelector.appendChild(btn);
      });

      // 2. 渲染列表
      listTitle.textContent = currentWarehouse + ' · 已点货物';
      const filtered = items.filter(it => it.warehouse === currentWarehouse);
      itemCount.textContent = filtered.length + ' 项';

      itemList.innerHTML = '';
      if (filtered.length === 0) {
        emptyState.style.display = 'block';
      } else {
        emptyState.style.display = 'none';
        filtered.forEach((it) => {
          const li = document.createElement('li');
          li.innerHTML = `
            <span class="item-name">${escapeHtml(it.name)}</span>
            <span class="item-qty">${it.qty}</span>
            <button class="delete-btn" data-index="${items.indexOf(it)}" aria-label="删除">✕</button>
          `;
          itemList.appendChild(li);
        });
      }
      save();
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    // ---------- Toast ----------
    let toastTimer;
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
    }

    // ---------- 交互 ----------
    
    // 切换仓库
    warehouseSelector.addEventListener('click', e => {
      const btn = e.target.closest('.wh-btn');
      if (!btn) return;
      currentWarehouse = btn.dataset.wh;
      render();
    });

    // 修改仓名功能
    renameWhBtn.addEventListener('click', () => {
      const oldName = currentWarehouse;
      const newName = prompt(`请输入新的仓名（当前：${oldName}）：`, oldName);
      
      if (newName && newName.trim() !== '' && newName !== oldName) {
        const trimmedName = newName.trim();
        // 更新仓名列表
        const idx = warehouses.indexOf(oldName);
        if (idx !== -1) warehouses[idx] = trimmedName;
        
        // 更新现有货物的归属仓
        items.forEach(it => {
          if (it.warehouse === oldName) it.warehouse = trimmedName;
        });
        
        currentWarehouse = trimmedName;
        render();
        showToast('仓名修改成功');
      }
    });

    // 添加物品
    function parseAndAdd(text) {
      const trimmed = text.trim();
      if (!trimmed) return;

      // 匹配末尾的数字
      const match = trimmed.match(/^(.+?)\s*(\d+(?:\.\d+)?)\s*(?:个|箱|件|包|瓶|袋)?$/);
      let name, qty;
      if (match) {
        name = match[1].trim();
        qty = parseFloat(match[2]);
      } else {
        name = trimmed;
        qty = 1;
      }

      if (!name) return;

      items.push({ name: name, qty: qty, warehouse: currentWarehouse });
      
      // 清空输入框
      transcript.value = '';
      
      render();
      
      // 关键点：重新聚焦输入框，防止键盘收起，方便连续听写
      setTimeout(() => {
        transcript.focus();
      }, 50);
    }

    addBtn.addEventListener('click', () => parseAndAdd(transcript.value));
    
    // 允许按回车直接添加
    transcript.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        parseAndAdd(transcript.value);
      }
    });

    // 删除物品
    itemList.addEventListener('click', (e) => {
      const btn = e.target.closest('.delete-btn');
      if (!btn) return;
      const idx = parseInt(btn.dataset.index, 10);
      if (!isNaN(idx)) {
        items.splice(idx, 1);
        render();
      }
    });

    // ---------- 启动 ----------
    load();
    render();

  })();
  </script>
</body>
</html>
