<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="点货">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23007aff'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='system-ui'>点</text></svg>">
  <title>点货</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 16px; padding-top: max(16px, env(safe-area-inset-top));
      background: #f5f5f7; color: #1d1d1f; min-height: 100vh;
    }
    h1 { font-size: 22px; margin: 0 0 16px; display: flex; align-items: center; gap: 8px; }
    .warehouse-selector {
      display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
    }
    .warehouse-selector button {
      flex: 1; min-width: 100px; padding: 12px; border: 2px solid #d1d1d6; border-radius: 12px;
      background: white; font-size: 16px; font-weight: 500; color: #1d1d1f; cursor: pointer;
      transition: all 0.15s;
    }
    .warehouse-selector button.active {
      border-color: #007aff; background: #007aff; color: white;
    }
    .voice-section {
      background: white; border-radius: 16px; padding: 20px; margin-bottom: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .voice-controls { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
    .mic-btn {
      width: 72px; height: 72px; border-radius: 50%; border: none;
      background: #007aff; color: white; font-size: 32px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s; flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(0,122,255,0.35);
    }
    .mic-btn:active { transform: scale(0.92); }
    .mic-btn.recording { background: #ff3b30; animation: pulse 1.2s infinite; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 4px 14px rgba(255,59,48,0.35); }
      50% { box-shadow: 0 4px 24px rgba(255,59,48,0.65); }
    }
    .voice-status { font-size: 14px; color: #86868b; flex: 1; }
    .voice-status.listening { color: #ff3b30; font-weight: 600; }
    #transcript {
      width: 100%; min-height: 60px; padding: 12px; border: 1.5px solid #d1d1d6;
      border-radius: 12px; font-size: 16px; line-height: 1.5; resize: vertical;
      font-family: inherit; background: #fafafa;
    }
    #transcript:focus { outline: none; border-color: #007aff; background: white; }
    .btn-row { display: flex; gap: 10px; margin-top: 12px; }
    .btn {
      flex: 1; padding: 14px; border: none; border-radius: 12px; font-size: 16px;
      font-weight: 600; cursor: pointer; transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.7; }
    .btn-primary { background: #007aff; color: white; }
    .btn-secondary { background: #e5e5ea; color: #1d1d1f; }
    .list-section {
      background: white; border-radius: 16px; overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .list-header {
      padding: 14px 16px; font-weight: 600; font-size: 15px;
      background: #fafafa; border-bottom: 1px solid #e5e5ea;
      display: flex; justify-content: space-between; align-items: center;
    }
    .list-header span { color: #86868b; font-weight: 400; }
    #item-list { list-style: none; margin: 0; padding: 0; }
    #item-list li {
      padding: 14px 16px; border-bottom: 1px solid #f0f0f0;
      display: flex; justify-content: space-between; align-items: center; font-size: 16px;
    }
    #item-list li:last-child { border-bottom: none; }
    .item-name { flex: 1; }
    .item-qty {
      font-weight: 700; color: #007aff; margin: 0 12px; font-size: 18px; min-width: 40px;
      text-align: right;
    }
    .delete-btn {
      background: none; border: none; color: #ff3b30; font-size: 20px;
      cursor: pointer; padding: 4px 8px;
    }
    .empty-state { padding: 32px; text-align: center; color: #86868b; font-size: 15px; }
    .toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
      background: #1d1d1f; color: white; padding: 12px 24px; border-radius: 12px;
      font-size: 14px; opacity: 0; transition: opacity 0.25s; pointer-events: none;
      z-index: 100;
    }
    .toast.show { opacity: 1; }
    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      body { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>

  <h1>📦 点货</h1>

  <div class="warehouse-selector" id="warehouse-selector">
    <button data-wh="A仓" class="active">A仓</button>
    <button data-wh="B仓">B仓</button>
    <button data-wh="C仓">C仓</button>
  </div>

  <div class="voice-section">
    <div class="voice-controls">
      <button class="mic-btn" id="mic-btn" title="点击开始语音输入">🎤</button>
      <div class="voice-status" id="voice-status">
        点击麦克风开始说话，或直接使用键盘听写
      </div>
    </div>
    <textarea id="transcript" placeholder="语音内容会出现在这里，也可以直接输入或使用键盘麦克风听写&#10;格式示例：苹果 10、香蕉 5"></textarea>
    <div class="btn-row">
      <button class="btn btn-primary" id="add-btn">➕ 添加</button>
      <button class="btn btn-secondary" id="clear-input-btn">清空输入</button>
    </div>
  </div>

  <div class="list-section">
    <div class="list-header">
      <span id="list-title">A仓 · 已点货物</span>
      <span id="item-count">0 项</span>
    </div>
    <ul id="item-list"></ul>
    <div class="empty-state" id="empty-state">还没有点货记录<br>说出“商品名 数量”然后添加</div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
  (function() {
    'use strict';

    // ---------- 状态 ----------
    const STORAGE_KEY = 'dianhuo_data_v1';
    let currentWarehouse = 'A仓';
    let items = []; // { name, qty, warehouse }

    // ---------- DOM ----------
    const $ = id => document.getElementById(id);
    const warehouseSelector = $('warehouse-selector');
    const micBtn = $('mic-btn');
    const voiceStatus = $('voice-status');
    const transcript = $('transcript');
    const addBtn = $('add-btn');
    const clearInputBtn = $('clear-input-btn');
    const itemList = $('item-list');
    const emptyState = $('empty-state');
    const listTitle = $('list-title');
    const itemCount = $('item-count');
    const toastEl = $('toast');

    // ---------- 持久化 ----------
    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ warehouse: currentWarehouse, items }));
      } catch (e) { /* 忽略隐私模式下的错误 */ }
    }

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (data.warehouse) currentWarehouse = data.warehouse;
        if (Array.isArray(data.items)) items = data.items;
      } catch (e) { /* 忽略 */ }
    }

    // ---------- 渲染 ----------
    function render() {
      // 货仓按钮状态
      warehouseSelector.querySelectorAll('button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.wh === currentWarehouse);
      });

      // 列表标题
      listTitle.textContent = currentWarehouse + ' · 已点货物';

      // 当前货仓的项目
      const filtered = items.filter(it => it.warehouse === currentWarehouse);
      itemCount.textContent = filtered.length + ' 项';

      // 列表
      itemList.innerHTML = '';
      if (filtered.length === 0) {
        emptyState.style.display = 'block';
      } else {
        emptyState.style.display = 'none';
        filtered.forEach((it, idx) => {
          const li = document.createElement('li');
          li.innerHTML = `
            <span class="item-name">${escapeHtml(it.name)}</span>
            <span class="item-qty">${it.qty}</span>
            <button class="delete-btn" data-index="${items.indexOf(it)}" aria-label="删除">✕</button>
          `;
          itemList.appendChild(li);
        });
      }

      save();
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    // ---------- Toast ----------
    let toastTimer;
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
    }

    // ---------- 货仓切换 ----------
    warehouseSelector.addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      currentWarehouse = btn.dataset.wh;
      render();
    });

    // ---------- 语音识别 ----------
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isRecording = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'zh-CN';
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isRecording = true;
        micBtn.classList.add('recording');
        voiceStatus.textContent = '🎙️ 正在聆听…再次点击停止';
        voiceStatus.classList.add('listening');
      };

      recognition.onresult = (event) => {
        let interim = '', final = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const t = event.results[i][0].transcript;
          if (event.results[i].isFinal) final += t;
          else interim += t;
        }
        transcript.value = final || interim;
      };

      recognition.onerror = (event) => {
        console.warn('语音识别错误:', event.error);
        if (event.error === 'not-allowed') {
          voiceStatus.textContent = '❌ 麦克风权限被拒绝，请在 Safari 设置中允许';
          showToast('请允许麦克风权限');
        } else if (event.error === 'no-speech') {
          voiceStatus.textContent = '没有检测到语音，请重试';
        } else {
          voiceStatus.textContent = '识别出错，请重试';
        }
      };

      recognition.onend = () => {
        isRecording = false;
        micBtn.classList.remove('recording');
        voiceStatus.classList.remove('listening');
        voiceStatus.textContent = '点击麦克风开始说话，或直接使用键盘听写';
      };
    } else {
      // 不支持 Web Speech API 时的降级
      micBtn.style.opacity = '0.4';
      voiceStatus.textContent = '此浏览器不支持语音识别，请使用键盘听写（点击输入框 → 键盘上的 🎤）';
    }

    micBtn.addEventListener('click', () => {
      if (!recognition) {
        showToast('请使用键盘听写：点击输入框，再按键盘上的麦克风');
        transcript.focus();
        return;
      }
      if (isRecording) {
        recognition.stop();
      } else {
        transcript.value = '';
        try {
          recognition.start();
        } catch (e) {
          // 防止重复 start
          recognition.stop();
          setTimeout(() => recognition.start(), 200);
        }
      }
    });

    // ---------- 添加物品 ----------
    function parseAndAdd(text) {
      const trimmed = text.trim();
      if (!trimmed) {
        showToast('请先输入或说出内容');
        return;
      }

      // 尝试解析“商品名 数量”，支持中文数字和阿拉伯数字
      // 匹配末尾的数字（可能带“个”“箱”“件”等单位）
      const match = trimmed.match(/^(.+?)\s*(\d+(?:\.\d+)?)\s*(?:个|箱|件|包|瓶|袋)?$/);
      let name, qty;

      if (match) {
        name = match[1].trim();
        qty = parseFloat(match[2]);
      } else {
        // 没有识别到数量，默认数量为 1，整句作为名称
        name = trimmed;
        qty = 1;
      }

      if (!name) {
        showToast('无法识别商品名称');
        return;
      }

      items.push({
        name: name,
        qty: qty,
        warehouse: currentWarehouse
      });

      transcript.value = '';
      render();
      showToast(`已添加：${name} × ${qty}`);
    }

    addBtn.addEventListener('click', () => parseAndAdd(transcript.value));

    // 回车快速添加（桌面端方便）
    transcript.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        parseAndAdd(transcript.value);
      }
    });

    clearInputBtn.addEventListener('click', () => {
      transcript.value = '';
      transcript.focus();
    });

    // ---------- 删除 ----------
    itemList.addEventListener('click', (e) => {
      const btn = e.target.closest('.delete-btn');
      if (!btn) return;
      const idx = parseInt(btn.dataset.index, 10);
      if (!isNaN(idx)) {
        items.splice(idx, 1);
        render();
      }
    });

    // ---------- 启动 ----------
    load();
    render();

    // 如果页面是通过“添加到主屏幕”打开的，隐藏地址栏影响
    if (window.navigator.standalone) {
      document.body.style.paddingTop = 'max(12px, env(safe-area-inset-top))';
    }
  })();
  </script>
</body>
</html>
